<!DOCTYPE html>
<html lang='en' dir='ltr' class='fi dark'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>Remote Access - Releu</title>
<link rel='stylesheet' href='./Settings - Pelican Demo_files/app-BqSNlVOE.css'>
<link rel='stylesheet' href='./Settings - Pelican Demo_files/index.css'>
<link rel='stylesheet' href='./Settings - Pelican Demo_files/app.css'>
<style>
[x-cloak]{{display:none!important}}
:root{{--font-family:'Inter Variable';--mono-font-family:'ui-monospace';--sidebar-width:20rem;--collapsed-sidebar-width:4.5rem;--default-theme-mode:system;}}
html.fi{{--livewire-progress-bar-color:var(--primary-500)}}
body{{background:#0b0d10!important;font-family:'Inter Variable',Inter,system-ui,sans-serif}}
.fi-main-ctn,.fi-main,.fi-page,.fi-page-main,.fi-page-content,.fi-section,.fi-section-header,.fi-section-content-ctn,.fi-section-content{{background:transparent!important}}

/* ── ra-* design tokens ── */
.ra-shell{{display:flex;flex-direction:column;gap:1rem}}
.ra-panel{{background:#141618!important;border:1px solid #2b3642!important;border-radius:.5rem;overflow:hidden}}
.ra-head{{padding:.875rem 1rem;border-bottom:1px solid #2b3642}}
.ra-head-row{{display:flex;align-items:flex-start;justify-content:space-between;gap:.75rem;flex-wrap:wrap}}
.ra-step{{font-size:.625rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#475569!important;margin-bottom:.3rem;display:flex;align-items:center;gap:.35rem}}
.ra-step svg{{width:11px;height:11px}}
.ra-title{{font-size:1.1rem;font-weight:700;color:#f8fafc!important;line-height:1.25;display:flex;align-items:center;gap:.5rem}}
.ra-title svg{{width:16px;height:16px;color:#64748b;flex-shrink:0}}
.ra-desc{{font-size:.8125rem;color:#64748b!important;margin-top:.3rem;line-height:1.55}}
.ra-body{{padding:.875rem 1rem;display:flex;flex-direction:column;gap:.875rem}}
.ra-card{{background:#111214!important;border:1px solid #2b3642!important;border-radius:.5rem;padding:.875rem 1rem}}

/* status badge */
.ra-status{{display:inline-flex;align-items:center;gap:.4rem;border:1px solid #2b3642!important;border-radius:999px;padding:.3rem .7rem;font-size:.625rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}}
.ra-status[data-tone='online']{{border-color:#f8fafc;background:#f8fafc;color:#020617}}
.ra-status[data-tone='waiting']{{color:#f8fafc}}
.ra-status[data-tone='offline']{{color:#94a3b8}}
.ra-dot{{width:.4rem;height:.4rem;border-radius:999px;background:currentColor!important;flex-shrink:0}}

/* label */
.ra-label{{font-size:.625rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#475569!important;display:flex;align-items:center;gap:.35rem;margin-bottom:.5rem}}
.ra-label svg{{width:11px;height:11px;flex-shrink:0}}
.ra-value{{font-size:.9375rem;font-weight:700;color:#f8fafc!important;line-height:1.3}}
.ra-muted{{font-size:.8125rem;color:#64748b!important;margin-top:.3rem;line-height:1.5}}
.ra-link{{font-family:ui-monospace,monospace;font-size:.875rem;color:#f8fafc!important;word-break:break-all}}

/* option cards */
.ra-option-grid{{display:grid;gap:.5rem}}
.ra-option{{display:flex;flex-direction:column;gap:.4rem;border:1px solid #2b3642!important;border-radius:.5rem;background:#111214!important;padding:.875rem;text-align:left;color:#e2e8f0!important;cursor:pointer;transition:border-color .13s}}
.ra-option:hover{{border-color:#3b4a5a!important}}
.ra-option--selected{{border-color:#f8fafc!important;background:#f8fafc!important;color:#020617!important}}
.ra-option-title{{font-size:.875rem;font-weight:700;display:flex;align-items:center;gap:.4rem}}
.ra-option-title svg{{width:14px;height:14px;flex-shrink:0}}
.ra-option-copy{{font-size:.8rem;line-height:1.55;opacity:.8}}

/* grids */
.ra-grid-2{{display:grid;gap:.75rem;grid-template-columns:repeat(2,minmax(0,1fr))}}
.ra-grid-3{{display:grid;gap:.75rem;grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:900px){{.ra-grid-3{{grid-template-columns:repeat(2,1fr)}}}}
@media(max-width:640px){{.ra-grid-2,.ra-grid-3{{grid-template-columns:1fr}}}}

/* meta pairs */
.ra-meta{{display:flex;flex-direction:column;gap:.3rem;font-size:.8125rem;color:#94a3b8!important}}
.ra-meta-row{{display:flex;align-items:center;gap:.5rem}}
.ra-meta-row svg{{width:12px;height:12px;color:#475569;flex-shrink:0}}
.ra-meta-row strong{{color:#f8fafc}}

/* pills */
.ra-pill-list{{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.5rem}}
.ra-pill{{display:inline-flex;align-items:center;gap:.3rem;border:1px solid #2b3642!important;background:#111214!important;padding:.25rem .55rem;border-radius:.3rem;font-size:.625rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#94a3b8!important}}
.ra-pill svg{{width:10px;height:10px;flex-shrink:0}}

/* warning */
.ra-warning{{background:rgba(245,158,11,.06)!important;border:1px solid rgba(245,158,11,.2)!important;border-radius:.5rem;padding:.75rem .875rem;font-size:.8125rem;color:#fbbf24!important;line-height:1.5;display:flex;align-items:flex-start;gap:.625rem}}
.ra-warning svg{{width:14px;height:14px;flex-shrink:0;margin-top:.1rem;color:#f59e0b}}

/* toggles */
.ra-toggle-grid{{display:flex;flex-direction:column;gap:.375rem}}
.ra-toggle{{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.6rem .75rem;border:1px solid #2b3642!important;background:#111214!important;border-radius:.375rem}}
.ra-toggle-label{{display:flex;align-items:center;gap:.45rem;font-size:.8125rem;color:#e2e8f0!important}}
.ra-toggle-label svg{{width:13px;height:13px;color:#475569;flex-shrink:0}}
.ra-toggle input{{width:1rem;height:1rem;accent-color:#fff;flex-shrink:0}}

/* spread + actions */
.ra-spread{{display:flex;justify-content:space-between;align-items:center;gap:.75rem;flex-wrap:wrap}}
.ra-actions{{display:flex;gap:.5rem;flex-wrap:wrap}}
.ra-btn{{appearance:none;border:1px solid #2b3642!important;border-radius:.375rem;padding:.5rem .875rem;font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:.4rem;transition:background .12s,border-color .12s}}
.ra-btn svg{{width:13px;height:13px;flex-shrink:0}}
.ra-btn-primary{{background:#f8fafc!important;border-color:#f8fafc!important;color:#020617!important}}
.ra-btn-primary:hover{{background:#e2e8f0!important}}
.ra-btn-ghost{{background:transparent!important;color:#f8fafc!important}}
.ra-btn-ghost:hover{{background:rgba(255,255,255,.05)!important}}
.ra-btn-danger{{border-color:rgba(239,68,68,.35)!important;background:rgba(239,68,68,.08)!important;color:#fca5a5!important}}
.ra-btn-danger:hover{{background:rgba(239,68,68,.16)!important}}

/* input */
.ra-input{{width:100%;border:1px solid #2b3642!important;border-radius:.375rem;background:#111214!important;padding:.5rem .75rem;font-size:.875rem;color:#f8fafc!important;outline:none;font-family:inherit}}
.ra-input:focus{{border-color:#3b82f6!important}}
.ra-input::placeholder{{color:#475569}}
.ra-input-label{{font-size:.625rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#475569!important;display:flex;align-items:center;gap:.35rem;margin-bottom:.35rem}}
.ra-input-label svg{{width:11px;height:11px}}

/* ── kill all blue from fi- Filament classes ── */
.fi-section-header-heading { color: #f8fafc !important; }
.fi-section-header-description { color: #64748b !important; }
.fi-section-header { background: transparent !important; border-color: #2b3642 !important; }
.fi-section-content-ctn, .fi-section-content { background: transparent !important; }
* { --primary-50: #111214; --primary-100: #111214; --primary-200: #2b3642; --primary-300: #94a3b8; --primary-400: #94a3b8; --primary-500: #f8fafc; --primary-600: #e2e8f0; --primary-700: #cbd5e1; --primary-800: #94a3b8; --primary-900: #64748b; --primary-950: #475569; }
input[type=text]:focus, input[type=password]:focus, input[type=number]:focus, select:focus, textarea:focus { border-color: #2b3642 !important; outline: none !important; box-shadow: none !important; }
input[type=checkbox] { accent-color: #f8fafc !important; }
</style>
</head><body class='fi-body fi-panel-server'><main class='fi-main fi-width-screen-2xl' style='padding:2rem;max-width:1100px;margin:0 auto;'><div class='fi-page'><div class='fi-page-content space-y-8'><section class='fi-section fi-section-has-header'><header class='fi-section-header'><div class='fi-section-header-text-ctn'><h2 class='fi-section-header-heading'>Remote Access</h2><p class='fi-section-header-description'>Create, protect, and manage the hosted remote-control link for this Releu install.</p></div></header><div class='fi-section-content-ctn'><div class='fi-section-content'>

    <div class='ra-head'>
      <div class='ra-title'><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;flex-shrink:0;display:inline-block;vertical-align:middle"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>Remote Access</div>

    </div>
  </div>
</div>
</div></div></section></div></div></main></body></html>
